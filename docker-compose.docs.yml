services:
  docs:
    image: incienso_shop_local_docs
    container_name: incienso_shop_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - path: ./.envs/.local/.django
        required: false
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./incienso_shop:/app/incienso_shop:z
    ports:
      - '9000:9000'
    command: /start-docs
